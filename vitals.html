<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthLink - Record Vitals</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Record Health Vitals</h1>
            <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="form-container">
            <form method="POST">
                <div class="form-group">
                    <label for="blood_pressure">Blood Pressure (systolic/diastolic):</label>
                    <input type="text" id="blood_pressure" name="blood_pressure" placeholder="120/80">
                </div>
                <div class="form-group">
                    <label for="heart_rate">Heart Rate (bpm):</label>
                    <input type="number" id="heart_rate" name="heart_rate" placeholder="72">
                </div>
                <div class="form-group">
                    <label for="temperature">Temperature (°F):</label>
                    <input type="number" step="0.1" id="temperature" name="temperature" placeholder="98.6">
                </div>
                <div class="form-group">
                    <label for="weight">Weight (lbs):</label>
                    <input type="number" step="0.1" id="weight" name="weight" placeholder="150.0">
                </div>
                <button type="submit" class="btn">Record Vitals</button>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
